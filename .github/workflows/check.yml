name: Check Discord Invite

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invite-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: GMAIL_ADDRESS
    timeout-minutes: 350

    env:
      CHECKS_PER_RUN: 33
      CHECK_INTERVAL_SECONDS: 600

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests

      - name: 循环检查邀请码
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_one_check() {
            python check_invite.py

            if ! git diff --quiet -- state.json; then
              git add state.json
              git commit -m "Update invite monitoring state"
              git push
            else
              echo "状态没有变化，无需提交。"
            fi
          }

          for ((i=1; i<=CHECKS_PER_RUN; i++)); do
            echo "第 $i / $CHECKS_PER_RUN 次检查"
            run_one_check

            if [ "$i" -lt "$CHECKS_PER_RUN" ]; then
              echo "等待 $CHECK_INTERVAL_SECONDS 秒后进行下一次检查..."
              sleep "$CHECK_INTERVAL_SECONDS"
            fi
          done
